name: Extract ZIP Archive

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Find and extract ZIP files
        run: |
          find . -name "*.zip" -type f | while read zipfile; do
            echo "Extracting: $zipfile"
            dirname=$(dirname "$zipfile")
            filename=$(basename "$zipfile" .zip)
            target_dir="$dirname/$filename"
            
            mkdir -p "$target_dir"
            unzip -o "$zipfile" -d "$target_dir"
            
            # Optional: Delete ZIP after extraction
            # rm "$zipfile"
          done
      
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-extract ZIP files"
          git push
